<!DOCTYPE html>
<html lang="es">
<head>

    /* Login Screen */

    }

    .admin-container {

    }

    .admin-header {

<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-container">

  <!-- Admin Panel -->
  <div id="panel-container">

      <div class="admin-header">

        </div>
        <div class="admin-controls">
          <div class="filter-group">
            <input type="text" id="search-input" placeholder="🔍 Buscar por nombre, email o teléfono..." style="padding: 10px; border: 2px solid var(--border-color); border-radius: 6px; font-size: 0.95em; flex: 1; max-width: 300px;">

            </select>
          </div>

      <!-- Estadísticas -->

        <div class="stat-card">

          <div class="stat-label">Pendientes</div>

  <!-- Modal de Detalles -->

    <div class="modal-content">
      <div class="modal-header">
        <h2>Detalles de Cotización</h2>
        <button class="btn-close" onclick="cerrarModal()">&times;</button>
      </div>
      
      <div id="modal-body">
        <!-- Se llenarán con JavaScript -->
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModal()">Cerrar</button>
        <button class="btn-save" onclick="guardarCambios()">Guardar Cambios</button>

  <!-- Scripts -->
  <script src="api-client.js?v=20260324-1"></script>
  <script>
    // ============ AUTENTICACIÓN + SEGURIDAD ============
    // Autenticación backend-only vía cookie httpOnly.

    // ============ SANITIZACIÓN Y VALIDACIÓN (XSS Protection) ============
    /**
     * Escapa caracteres HTML peligrosos para prevenir XSS
     * @param {string} str - String a escapar
     * @returns {string} String escapado
     */
    function sanitizeHTML(str) {
      if (!str || typeof str !== 'string') return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
        '/': '&#x2F;'
      };
      return str.replace(/[&<>"'\/]/g, (char) => map[char]);
    }

    /**
     * Sanitiza input de usuario (valida caracteres permitidos)
     * @param {string} input - Input del usuario
     * @param {string} type - Tipo de validación: 'text', 'email', 'number', 'notes'
     * @returns {string} Input sanitizado
     */
    function sanitizeInput(input, type = 'text') {
      if (!input || typeof input !== 'string') return '';
      
      let sanitized = input.trim();

      switch (type) {
        case 'email':
          // Solo permite caracteres válidos para email
          sanitized = sanitized.replace(/[^a-zA-Z0-9@._-]/g, '');
          break;
        case 'number':
          sanitized = sanitized.replace(/[^0-9.-]/g, '');
          break;
        case 'phone':
          sanitized = sanitized.replace(/[^0-9+\s\-()]/g, '');
          break;
        case 'notes':
          // Permite más caracteres pero escapa HTML
          sanitized = sanitizeHTML(sanitized);
          break;
        case 'text':
        default:
          // Escapa caracteres peligrosos
          sanitized = sanitizeHTML(sanitized);
          // Limita longitud máxima (255 caracteres)
          sanitized = sanitized.substring(0, 255);
      }

      return sanitized;
    }

    /**
     * Valida que un input no esté vacío
     * @param {string} input - Input a validar
     * @param {string} fieldName - Nombre del campo (para mensajes de error)
     * @returns {object} { valid: boolean, error: string }
     */
    function validateInput(input, fieldName = 'Campo') {
      if (!input || input.trim() === '') {
        return { valid: false, error: `${fieldName} no puede estar vacío` };
      }
      return { valid: true, error: '' };
    }

    /**
     * Valida email
     * @param {string} email - Email a validar
     * @returns {boolean} true si es válido
     */
    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    /**
     * Escapa caracteres peligrosos en strings para prevenir inyección
     * @param {string} str - String a proteger
     * @returns {string} String protegido
     */
    function escapeString(str) {
      if (!str || typeof str !== 'string') return '';
      return str
        .replace(/\\/g, '\\\\')
        .replace(/"/g, '\\"')
        .replace(/'/g, "\\'")
        .replace(/\0/g, '\\0');
    }

    /**
     * Genera un token CSRF único por sesión
     * @returns {string} Token CSRF
     */
    function generateCSRFToken() {
      const token = Math.random().toString(36).substring(2, 15) + 
                    Math.random().toString(36).substring(2, 15) +
                    Date.now().toString(36);
      sessionStorage.setItem('csrfToken', token);
      return token;
    }

    /**
     * Obtiene el token CSRF actual
     * @returns {string} Token CSRF
     */
    function getCSRFToken() {
      let token = sessionStorage.getItem('csrfToken');
      if (!token) {
        token = generateCSRFToken();
      }
      return token;
    }

    /**
     * Valida el token CSRF
     * @param {string} token - Token a validar
     * @returns {boolean} true si el token es válido
     */
    function validateCSRFToken(token) {
      const storedToken = sessionStorage.getItem('csrfToken');
      return storedToken === token && token !== undefined && token !== '';
    }

    // ============ RATE LIMITING ============
    const RATE_LIMIT_CONFIG = {
      maxAttempts: 5,
      blockDuration: 15 * 1000, // 15 segundos
      attemptLimit: 5 // intentos permitidos
    };
    let loginAttempts = 0;
    let loginBlocked = false;
    let blockTimeout = null;

    function actualizarEstadoLogin() {
      const btnLogin = document.querySelector('.btn-login');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      
      if (loginBlocked) {
        btnLogin.disabled = true;
        usernameInput.disabled = true;
        passwordInput.disabled = true;
        btnLogin.textContent = `⏳ Esperando ${Math.ceil(RATE_LIMIT_CONFIG.blockDuration / 1000)}s...`;
      } else {
        btnLogin.disabled = false;
        usernameInput.disabled = false;
        passwordInput.disabled = false;
        btnLogin.textContent = 'Acceder al Panel';
      }
    }

    async function autenticar(event) {
      event.preventDefault();
      
      // Verificar si está bloqueado
      if (loginBlocked) {
        console.warn('⚠️ Demasiados intentos. Intenta más tarde.');
        document.getElementById('login-error').textContent = '⏳ Demasiados intentos. Intenta en unos segundos.';
        document.getElementById('login-error').classList.add('show');
        return;
      }

      console.log('%c🔐 Iniciando autenticación...', 'color: #f39c12; font-weight: bold;');
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        await adminLogin(username, password);
        console.log('✅ Sesion admin iniciada en backend');

        sessionStorage.setItem('admin_user', username);
        sessionStorage.setItem('login_time', Date.now());

        // Resetear intentos
        loginAttempts = 0;

        // Registrar login en auditoría
        registrarAuditoria('LOGIN', { usuario: username }, 'success');

        // Mostrar panel
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('panel-container').style.display = 'block';

        // Limpiar formulario
        document.getElementById('login-form').reset();

        console.log('📋 Cargando cotizaciones...');
        cargarCotizaciones();

        // Iniciar timeout de sesión
        iniciarSessionTimeout();
      } catch (error) {
        // Incrementar intentos fallidos
        loginAttempts++;
        console.error(`❌ Intento fallido ${loginAttempts}/${RATE_LIMIT_CONFIG.maxAttempts}`);

        // Registrar intento fallido en auditoría
        registrarAuditoria('LOGIN_FALLIDO', { usuario: username, intento: loginAttempts }, 'failed');

        // Si se alcanzó el máximo, bloquear
        if (loginAttempts >= RATE_LIMIT_CONFIG.maxAttempts) {
          loginBlocked = true;
          actualizarEstadoLogin();

          blockTimeout = setTimeout(() => {
            loginBlocked = false;
            loginAttempts = 0;
            actualizarEstadoLogin();
            console.log('✅ Bloqueo de login desbloqueado');
          }, RATE_LIMIT_CONFIG.blockDuration);
        }

        // Mostrar error
        const errorDiv = document.getElementById('login-error');
        errorDiv.textContent = `❌ Credenciales inválidas (${loginAttempts}/${RATE_LIMIT_CONFIG.maxAttempts})`;
        errorDiv.classList.add('show');

        setTimeout(() => {
          errorDiv.classList.remove('show');
        }, 4000);

        // Limpiar contraseña
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    // ============ SESSION TIMEOUT (30 minutos) ============
    const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 minutos
    const WARNING_TIME = 25 * 60 * 1000; // Advertencia a los 25 minutos
    let sessionTimeoutId = null;
    let warningTimeoutId = null;

    function iniciarSessionTimeout() {
      // Limpiar timeouts anteriores
      if (sessionTimeoutId) clearTimeout(sessionTimeoutId);
      if (warningTimeoutId) clearTimeout(warningTimeoutId);

      console.log('⏱️ Session timeout iniciado (30 minutos)');

      // Advertencia a los 25 minutos
      warningTimeoutId = setTimeout(() => {
        console.warn('⚠️ Tu sesión expirará en 5 minutos por inactividad');
        alert('⚠️ ADVERTENCIA: Tu sesión expirará en 5 minutos por inactividad.\n\nHaz clic en OK para continuar.');
      }, WARNING_TIME);

      // Cerrar sesión después de 30 minutos
      sessionTimeoutId = setTimeout(() => {
        console.warn('🔒 Sesión expirada por timeout');
        registrarAuditoria('SESSION_TIMEOUT', {}, 'auto-logout');
        cerrarSesionPorTimeout();
      }, SESSION_TIMEOUT);
    }

    function resetSessionTimeout() {
      // Se llama en cada interacción del usuario
      const token = sessionStorage.getItem('admin_user');
      if (token) {
        iniciarSessionTimeout();
      }
    }

    function cerrarSesionPorTimeout() {
      sessionStorage.removeItem('admin_user');
      sessionStorage.removeItem('login_time');
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('panel-container').style.display = 'none';
      alert('🔒 Tu sesión ha expirado por inactividad. Por favor, inicia sesión nuevamente.');
    }

    async function cerrarSesion() {
      if (confirm('¿Deseas cerrar sesión?')) {
        registrarAuditoria('LOGOUT', { usuario: sessionStorage.getItem('admin_user') }, 'success');
        try {
          await adminLogout();
        } catch (error) {
          console.warn('⚠️ No se pudo cerrar sesión en backend:', error.message);
        }
        sessionStorage.removeItem('admin_user');
        sessionStorage.removeItem('login_time');
        if (sessionTimeoutId) clearTimeout(sessionTimeoutId);
        if (warningTimeoutId) clearTimeout(warningTimeoutId);
        location.reload();
      }
    }

    // ============ AUDITORÍA ============
    async function registrarAuditoria(accion, detalles = {}, estado = 'success') {
      try {
        const usuario = sessionStorage.getItem('admin_user') || 'desconocido';
        const auditLog = {
          accion,
          usuario,
          estado,
          detalles,
          timestamp: new Date().toISOString(),
          userAgent: navigator.userAgent,
          ip: 'cliente' // En producción, obtener desde servidor
        };

        guardarAuditoriaLocal(auditLog);
      } catch (err) {
        console.error('❌ Error al registrar auditoría:', err);
      }
    }

    function guardarAuditoriaLocal(log) {
      try {
        let logs = JSON.parse(localStorage.getItem('audit_logs_local') || '[]');
        logs.push(log);
        // Mantener solo últimos 100 registros
        logs = logs.slice(-100);
        localStorage.setItem('audit_logs_local', JSON.stringify(logs));
      } catch (err) {
        console.warn('No se pudo guardar auditoría local:', err);
      }
    }

    // Detectar inactividad (resetear timeout en cada interacción)
    document.addEventListener('click', resetSessionTimeout);
    document.addEventListener('keypress', resetSessionTimeout);
    document.addEventListener('mousemove', resetSessionTimeout);

    // Verificar sesión al cargar
    window.addEventListener('load', async () => {
      try {
        const session = await adminSession();
        if (session.authenticated) {
          sessionStorage.setItem('admin_user', session.user || 'admin');
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('panel-container').style.display = 'block';
          cargarCotizaciones();
          iniciarSessionTimeout();
          return;
        }
      } catch (error) {
        console.log('ℹ️ Sesión admin no activa');
      }

      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('panel-container').style.display = 'none';
    });

    // ============ PANEL ADMIN ============
    let cotizacionesData = [];
    let cotizacionEditando = null;

    function formatFecha(fechaValor, includeTime = false) {
      if (!fechaValor) return '-';

      let dateObj = null;
      if (typeof fechaValor === 'string' || typeof fechaValor === 'number') {
        dateObj = new Date(fechaValor);
      } else if (fechaValor.seconds !== undefined) {
        dateObj = new Date(fechaValor.seconds * 1000);
      } else if (fechaValor._seconds !== undefined) {
        dateObj = new Date(fechaValor._seconds * 1000);
      }

      if (!dateObj || Number.isNaN(dateObj.getTime())) return '-';
      return includeTime ? dateObj.toLocaleString('es-ES') : dateObj.toLocaleDateString('es-ES');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Filtrar por estado
      document.getElementById('filter-status').addEventListener('change', () => {
        mostrarCotizaciones();
      });
      
      // Búsqueda en tiempo real
      document.getElementById('search-input').addEventListener('input', () => {
        mostrarCotizaciones();
      });
    });

    async function cargarCotizaciones() {
      const container = document.getElementById('cotizaciones-container');
      container.innerHTML = '<div class="loading">Cargando cotizaciones...</div>';

      console.log('🔍 Verificando disponibilidad de obtenerCotizacionesAdmin...');
      console.log('typeof obtenerCotizacionesAdmin =', typeof obtenerCotizacionesAdmin);
      
      if (typeof obtenerCotizacionesAdmin !== 'function') {
        console.error('❌ obtenerCotizacionesAdmin no es una función. Disponible como:', typeof obtenerCotizacionesAdmin);
        console.log('✅ Funciones disponibles en window:', Object.keys(window).filter(k => k.includes('Cotiz') || k.includes('admin')));
        container.innerHTML = `
          <div class="empty-state">
            <p>❌ Error crítico: API de cotizaciones no está disponible</p>
            <p>Por favor recarga la página (Cmd+Shift+R)</p>
          </div>
        `;
        return;
      }

      const result = await obtenerCotizacionesAdmin();

      if (result.success) {
        console.log(`✅ Cotizaciones cargadas: ${result.data.length} registros`);
        cotizacionesData = result.data || [];
        mostrarCotizaciones();
        actualizarEstadisticas();
      } else {
        console.error('❌ Error al cargar cotizaciones:', result.error);
        const errorMsg = sanitizeHTML(result.error || 'Error desconocido');
        container.innerHTML = `
          <div class="empty-state">
            <p>❌ Error al cargar cotizaciones</p>
            <p>${errorMsg}</p>

      cotizacionesFiltradas.forEach(cot => {

    function mostrarTransicionesValidas() {
      const statusSelect = document.getElementById('edit-status');
      const transicionesInfo = document.getElementById('transiciones-info');
      if (!statusSelect || !transicionesInfo) return;

      const nuevoEstado = statusSelect.value;
      const transicionesPermitidas = transicionesValidas[nuevoEstado] || [];
      
      if (transicionesPermitidas.length === 0) {
        transicionesInfo.textContent = '🔒 Este estado es final, no se puede cambiar';
        transicionesInfo.style.color = '#ffcccc';
      } else {
        transicionesInfo.textContent = `📤 Desde aquí puedes cambiar a: ${transicionesPermitidas.join(', ')}`;
        transicionesInfo.style.color = 'rgba(255,255,255,0.9)';
      }
    }

    // ============ VALIDACIÓN DE TRANSICIONES DE ESTADO ============
    const transicionesValidas = {
      'pendiente': ['contactado', 'cancelado'],
      'contactado': ['completado', 'cancelado'],
      'completado': [], // No se puede cambiar desde completado
      'cancelado': []   // No se puede cambiar desde cancelado
    };

    function esTransicionValida(estadoActual, nuevoEstado) {
      // Si no cambia, es válido
      if (estadoActual === nuevoEstado) {
        return { valid: true, message: 'Sin cambios' };
      }

      const transicionesPermitidas = transicionesValidas[estadoActual] || [];
      if (transicionesPermitidas.includes(nuevoEstado)) {
        return { valid: true, message: 'Transición válida' };
      }

      return {
        valid: false,
        message: `No se puede cambiar de "${estadoActual}" a "${nuevoEstado}"`
      };
    }

    async function guardarCambios() {
      if (!cotizacionEditando) {
        console.error('❌ No hay cotización editándose');
        return;
      }

      // Verificar CSRF token
      const csrfToken = getCSRFToken();
      if (!csrfToken) {
        console.error('❌ Error de seguridad: Token CSRF no disponible');
        alert('❌ Error de seguridad. Por favor recarga la página.');
        return;
      }

      const nuevoEstado = sanitizeHTML(document.getElementById('edit-status').value).trim();
      const notas = sanitizeHTML(document.getElementById('edit-notas').value).trim();
      cotizacionId = sanitizeHTML(cotizacionEditando.id).trim();

      // Validar que el estado es uno de los valores permitidos
      const estadosPermitidos = ['pendiente', 'contactado', 'completado', 'cancelado'];
      if (!estadosPermitidos.includes(nuevoEstado)) {
        console.error('❌ Estado inválido');
        alert('❌ Estado inválido. Por favor selecciona un estado válido.');
        return;
      }

      // Validar que la cotización ID no está vacía
      if (!cotizacionId || cotizacionId === '' || cotizacionId === 'N/A') {
        console.error('❌ ID de cotización inválido');
        alert('❌ Error: ID de cotización inválido.');
        return;
      }

      // Validar que las notas no sean exesivamente largas (máximo 5000 caracteres)
      if (notas.length > 5000) {
        alert('❌ Las notas no pueden superar 5000 caracteres.');
        return;
      }

      // Validar transición
      const validacion = esTransicionValida(cotizacionEditando.status, nuevoEstado);
      if (!validacion.valid) {
        alert(`❌ ${validacion.message}\n\nTransiciones válidas:\n${(transicionesValidas[cotizacionEditando.status] || []).join(', ') || 'Ninguna'}`);
        return;
      }

      // Validar que haya cambios reales
      const hayEstadoNuevo = nuevoEstado !== cotizacionEditando.status;
      const hayNotasNuevas = notas !== (cotizacionEditando.notas || '');

      if (!hayEstadoNuevo && !hayNotasNuevas) {
        alert('ℹ️ No hay cambios que guardar');
        return;
      }

      // Mostrar indicador de carga
      const btnGuardar = document.querySelector('.btn-save');
      const textOriginal = btnGuardar?.textContent || 'Guardar Cambios';
      if (btnGuardar) {
        btnGuardar.disabled = true;
        btnGuardar.textContent = '⏳ Guardando...';
      }

      console.log(`📝 Actualizando cotización ${cotizacionId}...`);
      console.log(`  Estado: ${cotizacionEditando.status} → ${nuevoEstado}`);
      console.log(`  Notas: ${notas.substring(0, 50)}...`);

      const result = await actualizarEstadoCotizacion(
        cotizacionId,
        nuevoEstado,
        notas,
        csrfToken
      );

      // Restaurar botón
      if (btnGuardar) {
        btnGuardar.disabled = false;
        btnGuardar.textContent = textOriginal;
      }

      if (result.success) {
        console.log('✅ Cotización actualizada');
        
        // Registrar en auditoría
        registrarAuditoria('CAMBIO_ESTADO_COTIZACION', {
          cotizacionId: cotizacionId,
          cliente: sanitizeHTML(cotizacionEditando.nombre),
          estadoAnterior: cotizacionEditando.status,
          estadoNuevo: nuevoEstado,
          notasActualizadas: hayNotasNuevas,
          csrfTokenValidado: true
        }, 'success');
        
        // Actualizar a nivel local para no recargar todo
        cotizacionEditando.status = nuevoEstado;
        cotizacionEditando.notas = notas;
        const confirmacion = document.createElement('div');
        confirmacion.style.cssText = `
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: #27ae60;
          color: white;
          padding: 30px 50px;
          border-radius: 8px;
          font-size: 18px;
          font-weight: bold;
          z-index: 9999;
          box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        `;
        confirmacion.textContent = '✅ Cambios guardados correctamente';
        document.body.appendChild(confirmacion);

        setTimeout(() => {
          confirmacion.remove();
          cerrarModal();
          cargarCotizaciones(); // Recargar para ver cambios
        }, 1500);
      } else {
        console.error('❌ Error al actualizar:', result.error);
        
        // Registrar intento fallido en auditoría
        registrarAuditoria('CAMBIO_ESTADO_COTIZACION', {
          cotizacionId: cotizacionEditando.id,
          cliente: cotizacionEditando.nombre,
          estadoAnterior: cotizacionEditando.status,
          estadoNuevo: nuevoEstado,
          error: result.error
        }, 'failed');
        
        alert(`❌ Error al guardar: ${result.error}`);
      }
    }

    // Cerrar modal al hacer click fuera
    document.getElementById('modal-detalles').addEventListener('click', (e) => {
      if (e.target.id === 'modal-detalles') {
        cerrarModal();
      }
    });
  </script>
</body>
</html>
